<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Smile AI</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

      :root {
        --bg-color: #F9F9F8;
        --sidebar-bg: #EFEFEE;
        --text-primary: #1F1F1F;
        --text-secondary: #717171;
        --border-color: #E2E2E1;
        --accent: #E58D5D;
        --input-bg: #FFFFFF;
        --hover-bg: #E3E3E2;
        --message-bg: #FFFFFF;
        --radius: 12px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #2D2D2D;
          --sidebar-bg: #1F1F1F;
          --text-primary: #F3F3F3;
          --text-secondary: #A0A0A0;
          --border-color: #424242;
          --accent: #E58D5D;
          --input-bg: #3B3B3B;
          --hover-bg: #2A2A2A;
          --message-bg: #3B3B3B;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-primary);
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      /* Sidebar */
      #sidebar {
        width: 260px;
        background-color: var(--sidebar-bg);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        transition: transform 0.3s ease;
        z-index: 100;
      }

      .sidebar-header {
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .new-chat-btn {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: transparent;
        border: none;
        border-radius: 6px;
        color: var(--text-primary);
        font-weight: 500;
        cursor: pointer;
        text-align: left;
      }
      .new-chat-btn:hover { background-color: var(--hover-bg); }

      .settings-btn {
        padding: 8px;
        background: transparent;
        border: none;
        border-radius: 6px;
        color: var(--text-secondary);
        cursor: pointer;
      }
      .settings-btn:hover { background-color: var(--hover-bg); color: var(--text-primary); }

      .history-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
      }

      /* Main Chat */
      #main {
        flex: 1;
        display: flex;
        flex-direction: column;
        position: relative;
      }

      .top-nav {
        display: flex;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border-color);
        gap: 12px;
      }

      .menu-btn {
        display: none;
        background: transparent;
        border: none;
        font-size: 24px;
        color: var(--text-primary);
        cursor: pointer;
      }

      .model-selector {
        background: var(--bg-color);
        border: 1px solid var(--border-color);
        color: var(--text-primary);
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        outline: none;
        cursor: pointer;
      }

      .chat-container {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        scroll-behavior: smooth;
      }

      .welcome {
        text-align: center;
        margin: auto;
      }
      .welcome h1 { font-size: 32px; font-weight: 600; margin-bottom: 12px; }
      .welcome p { color: var(--text-secondary); font-size: 16px; }

      .message {
        display: flex;
        gap: 16px;
        max-width: 800px;
        margin: 0 auto;
        width: 100%;
        line-height: 1.6;
      }

      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        flex-shrink: 0;
      }
      .avatar.user { background-color: var(--text-primary); color: var(--bg-color); }
      .avatar.ai { background-color: var(--accent); color: white; }

      .content { flex: 1; overflow-x: auto; }
      .content p { margin-bottom: 12px; }
      .content p:last-child { margin-bottom: 0; }
      .content pre {
        background-color: #1E1E1E;
        color: #D4D4D4;
        padding: 12px;
        border-radius: 8px;
        overflow-x: auto;
        margin: 12px 0;
      }
      .content code { font-family: monospace; }

      /* Input Area */
      .input-area {
        padding: 16px 24px;
        background-color: var(--bg-color);
      }

      .input-wrapper {
        max-width: 800px;
        margin: 0 auto;
        background-color: var(--input-bg);
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        padding: 12px 16px;
        display: flex;
        gap: 12px;
        align-items: flex-end;
        box-shadow: 0 4px 6px rgba(0,0,0,0.02);
      }
      .input-wrapper:focus-within {
        border-color: var(--accent);
      }

      textarea {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--text-primary);
        font-size: 16px;
        resize: none;
        outline: none;
        max-height: 200px;
        padding: 4px 0;
      }

      .send-btn {
        background: var(--text-primary);
        color: var(--bg-color);
        border: none;
        border-radius: 8px;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

      .disclaimer {
        text-align: center;
        font-size: 12px;
        color: var(--text-secondary);
        margin-top: 12px;
      }

      /* Modal */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        backdrop-filter: blur(2px);
      }
      .modal-overlay.active { display: flex; }

      .modal {
        background: var(--bg-color);
        padding: 24px;
        border-radius: var(--radius);
        width: 90%;
        max-width: 400px;
        border: 1px solid var(--border-color);
      }
      .modal h2 { margin-bottom: 20px; font-size: 20px; }

      .form-group { margin-bottom: 16px; }
      .form-group label { display: block; font-size: 14px; margin-bottom: 8px; font-weight: 500; }
      .form-group input {
        width: 100%;
        padding: 10px;
        background: var(--input-bg);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        color: var(--text-primary);
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 24px;
      }
      .btn {
        padding: 10px 16px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        font-weight: 500;
      }
      .btn-cancel { background: transparent; color: var(--text-primary); }
      .btn-save { background: var(--text-primary); color: var(--bg-color); }

      @media (max-width: 768px) {
        #sidebar {
          position: absolute;
          left: 0;
          top: 0;
          bottom: 0;
          transform: translateX(-100%);
        }
        #sidebar.open { transform: translateX(0); }
        .menu-btn { display: block; }
        .message { padding: 0; }
        .input-area { padding: 12px; }
      }

      .typing {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 8px 0;
      }
      .typing-dot {
        width: 6px; height: 6px;
        border-radius: 50%;
        background-color: var(--text-secondary);
        animation: blink 1.4s infinite both;
      }
      .typing-dot:nth-child(1) { animation-delay: 0.2s; }
      .typing-dot:nth-child(2) { animation-delay: 0.4s; }
      .typing-dot:nth-child(3) { animation-delay: 0.6s; }

      @keyframes blink {
        0% { opacity: 0.2; }
        20% { opacity: 1; }
        100% { opacity: 0.2; }
      }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <div class="sidebar-header">
        <button class="new-chat-btn" id="newChatBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Nouveau chat
        </button>
        <button class="settings-btn" id="settingsBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </button>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>

    <div id="main">
      <div class="top-nav">
        <button class="menu-btn" id="menuBtn">☰</button>
        <select class="model-selector" id="modelSelector">
          <option value="claude">Claude 3.5 Sonnet</option>
          <option value="groq">Llama 3 (Groq)</option>
          <option value="gemini">Gemini 1.5 Pro</option>
        </select>
      </div>

      <div class="chat-container" id="chatContainer">
        <div class="welcome" id="welcomeScreen">
          <h1>Bonjour</h1>
          <p>Comment puis-je vous aider aujourd'hui ?</p>
        </div>
      </div>

      <div class="input-area">
        <div class="input-wrapper">
          <textarea id="promptInput" rows="1" placeholder="Posez une question à Smile AI..."></textarea>
          <button class="send-btn" id="sendBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
        <div class="disclaimer">Smile AI peut faire des erreurs. Vérifiez les informations importantes.</div>
      </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
      <div class="modal">
        <h2>Clés API</h2>
        <div class="form-group">
          <label>Anthropic API Key (Claude)</label>
          <input type="password" id="keyClaude" placeholder="sk-ant-..." />
        </div>
        <div class="form-group">
          <label>Groq API Key (Llama/Mistral)</label>
          <input type="password" id="keyGroq" placeholder="gsk_..." />
        </div>
        <div class="form-group">
          <label>Google Gemini API Key</label>
          <input type="password" id="keyGemini" placeholder="AIza..." />
        </div>
        <div class="modal-actions">
          <button class="btn btn-cancel" id="cancelSettingsBtn">Annuler</button>
          <button class="btn btn-save" id="saveSettingsBtn">Enregistrer</button>
        </div>
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
